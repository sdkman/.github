name: "Reusable: Dependabot Digest"

on:
  workflow_call:
    inputs:
      pr_ci_workflow:
        required: true
        type: string
        description: |
          Name of the PR-CI workflow on the caller repo (e.g. "CI", "Pull Requests",
          "Test deployment"). Used to resolve green/red/pending status per PR.
    secrets:
      OPENCLAW_HOOK_URL:
        required: true
      OPENCLAW_HOOK_TOKEN:
        required: true

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      actions: read
    env:
      PROMPT_TEMPLATE: |
        <role>
        You are Chloé. You have just received an automated Dependabot digest from a
        GitHub Actions workflow that runs once per week per repository.
        </role>

        <task>
        1. Deliver the contents of <digest> below to Marco in our DM, verbatim.
        2. Wait silently for Marco's response. This is the end of your turn.
        3. In a later turn, if Marco confirms (e.g. "yes", "go ahead", "merge the
           greens"), approve and merge ONLY the PRs marked ✅ green, using exactly:
               gh pr merge <number> --squash --body ""
        4. For PRs marked ❌ red or ⏳ pending, ask Marco per-PR rather than acting.
        </task>

        <context>
        This message arrives from an automated workflow, not from Marco directly.
        Marco will respond in a later turn with his decision. Your only action this
        turn is to send <digest> to him verbatim.
        </context>

        <digest>
        📦 Dependabot — {repo}: {count} new PRs ({date})

        {bullets}

        Should I approve and merge the green ones?
        </digest>
    steps:
      - name: Send digest
        env:
          REPO: ${{ github.repository }}
          PR_CI_WORKFLOW: ${{ inputs.pr_ci_workflow }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
        run: |
          set -e
          REPO_NAME="${REPO#*/}"
          DATE_ISO=$(date -u +%Y-%m-%d)

          # Fetch open PRs. Self-healing on failure — never raise a workflow failure.
          set +e
          PRS=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" 2>&1); RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::warning::Digest query failed (rc=$RC); skipping"
            echo "$PRS" | head -5
            exit 0
          fi

          # Filter to dependabot[bot] PRs created in the last 24h.
          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          MATCHES=$(echo "$PRS" | jq -c --arg cutoff "$CUTOFF" \
            '[ .[] | select(.user.login == "dependabot[bot]" and .created_at >= $cutoff) ]')
          COUNT=$(echo "$MATCHES" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "No new Dependabot PRs in the last 24h — nothing to send."
            exit 0
          fi

          # Resolve per-PR CI status via the named PR-CI workflow conclusion.
          status_for() {
            local sha="$1" conclusion
            conclusion=$(gh api \
              "repos/${REPO}/actions/runs?event=pull_request&head_sha=${sha}&per_page=5" \
              --jq '[.workflow_runs[] | select(.name == env.PR_CI_WORKFLOW)] | .[0].conclusion // "pending"' \
              2>/dev/null || echo "pending")
            case "$conclusion" in
              success) echo "✅" ;;
              failure|cancelled|timed_out|action_required) echo "❌" ;;
              *) echo "⏳" ;;
            esac
          }

          # Build bullets, one per PR: status emoji, number, then title. No URLs —
          # bare links spawn noisy auto-embeds in Discord.
          BULLETS=""
          while IFS=$'\t' read -r NUM TITLE HEAD_SHA; do
            STATUS=$(status_for "$HEAD_SHA")
            LINE="${STATUS} #${NUM}  ${TITLE}"
            BULLETS=${BULLETS:+$BULLETS$'\n'}$LINE
          done < <(echo "$MATCHES" | jq -r '.[] | [.number, .title, .head.sha] | @tsv')

          # Substitute placeholders in the template.
          PROMPT="${PROMPT_TEMPLATE//\{repo\}/$REPO_NAME}"
          PROMPT="${PROMPT//\{count\}/$COUNT}"
          PROMPT="${PROMPT//\{date\}/$DATE_ISO}"
          PROMPT="${PROMPT//\{bullets\}/$BULLETS}"

          # Compose payload and POST to OpenClaw hook. Self-healing on non-2xx.
          PAYLOAD=$(jq -n --arg msg "$PROMPT" \
            '{message: $msg, name: "📦 Dependabot Digest", model: "openrouter/anthropic/claude-haiku-4-5", deliver: true, channel: "discord", to: "channel:1474759623209783327"}')

          set +e
          HTTP=$(curl -s -o /tmp/digest_resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$HOOK_URL"); RC=$?
          set -e
          if [ $RC -ne 0 ] || [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::warning::Digest POST failed (rc=$RC http=$HTTP); skipping"
            head -5 /tmp/digest_resp 2>/dev/null
            exit 0
          fi
