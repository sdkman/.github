name: "Reusable: Triage (Fork PR)"

on:
  workflow_call:
    inputs:
      pr_workflow_name:
        required: false
        type: string
        default: "Pull Requests"
    secrets:
      OPENCLAW_HOOK_URL:
        required: true
      OPENCLAW_HOOK_TOKEN:
        required: true

jobs:
  triage:
    runs-on: ubuntu-latest
    # Notify once per PR: only the PR-event CI run (not the duplicate push run),
    # and only for fork PRs. Dependabot is handled by the digest (path C).
    if: >-
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target') &&
      github.event.workflow_run.head_repository.fork == true
    steps:
      - name: Send fork PR triage notification
        env:
          HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Resolve the PR number. workflow_run.pull_requests[] entries are stubs
          # (number/head/base only), so fall back to the head SHA when absent
          # (e.g. fork PRs, where the array is empty).
          PR_NUMBER=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.state == "open")) | .[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR associated with this run — skipping."
            exit 0
          fi

          # The run stub has no title/html_url/author, so fetch the full PR object.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{title, html_url, author: .user.login}')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
          PR_URL=$(echo "$PR_JSON" | jq -r '.html_url // empty')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author // empty')

          # Never send a blank notification.
          if [ -z "$PR_TITLE" ] || [ -z "$PR_URL" ]; then
            echo "PR #$PR_NUMBER details unavailable (title/url empty) — skipping."
            exit 0
          fi

          MSG="PR #${PR_NUMBER}: ${PR_TITLE}"$'\n'"Author: ${PR_AUTHOR}"$'\n'"URL: ${PR_URL}"

          PAYLOAD=$(jq -n \
            --arg message "$MSG" \
            --arg name "GitHub Triage" \
            '{message: $message, name: $name, model: "openrouter/anthropic/claude-haiku-4-5", deliver: true, channel: "discord", to: "channel:1474759623209783327"}')

          curl -sf -X POST \
            -H "Authorization: Bearer ${HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$HOOK_URL"
